name: check

on:
  pull_request:
  push:
    branches: [main, edge]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go mod tidy -diff

  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install ./cmd/tstorm
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: tstorm render --target claude --out payloads/claude --check
      - run: tstorm render --target codex --out payloads/codex --check
      - run: tstorm render --target pi --out payloads/pi --check

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install ./cmd/tstorm
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: tstorm check isolation workflow
      - run: tstorm check frontmatter
      - run: tstorm check policy
      - run: tstorm check version

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: cargo install --git https://github.com/stormlightlabs/trps --rev 5e9333be101bb2c2e4150de419494bd9d65f6ae4 trps-cli
      - run: go install ./cmd/tstorm
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: tstorm check prose --warn

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
