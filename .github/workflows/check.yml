name: check

on:
  pull_request:
  push:
    branches: [main, edge]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go mod tidy -diff

  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The committed payload is what people install, and a hand edit there is
      # lost at the next render. This is the check that catches one.
      - run: go run ./cmd/tstorm render --target claude --check

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gates run over this repository, which is the tree they were
      # written against. `go test ./...` in the job above covers them against
      # fixtures written to be wrong.
      - run: go run ./cmd/tstorm check isolation workflow
      - run: go run ./cmd/tstorm check frontmatter
      # The deny rules are merged into a repository's settings by hand, so
      # this is what notices when the workflow gains one and .claude does not.
      - run: go run ./cmd/tstorm check policy

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pinned, because a detector that changes under the job reports a
      # different repository every week. Raise it deliberately, and rerun the
      # count in CHANGELOG.md when you do.
      - run: cargo install --git https://github.com/stormlightlabs/trps --rev 5e9333be101bb2c2e4150de419494bd9d65f6ae4 trps-cli
      # --warn reports and exits 0. A trope count is not a quality score, and
      # a check that cannot be certain must not be the one that blocks.
      - run: go run ./cmd/tstorm check prose --warn

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
